[package]
name = "typdiff-git"
version = "0.7.4"
edition = "2021"
description = "Generate one visual Typst revision PDF from all .typ files changed between two Git revisions"
license = "Apache-2.0"
repository = "https://github.com/shozee/typdiff-git"
homepage = "https://github.com/shozee/typdiff-git"
documentation = "https://docs.rs/typdiff-git"
readme = "README.md"
keywords = ["typst", "git", "diff", "revision", "pdf"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[[bin]]
name = "typdiff-git"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tempfile = "3.13"
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
