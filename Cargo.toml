[package]
name = "typdiff-git"
version = "0.7.4"
edition = "2021"
description = "Generate one visual Typst revision PDF from all .typ files changed between two Git revisions"
license = "Apache-2.0"
repository = "https://example.invalid/typdiff-git"

[[bin]]
name = "typdiff-git"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tempfile = "3.13"
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
